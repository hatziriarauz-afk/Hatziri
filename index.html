<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Feliz 30 de septiembre  💙</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      background: #03152e;
      color: #fff;
    }

    .hidden {
      display: none !important;
    }

    .background {
      position: fixed;
      inset: 0;
      z-index: -2;
      background:
        linear-gradient(rgba(2, 22, 55, 0.48), rgba(2, 22, 55, 0.68)),
        url("https://i.pinimg.com/736x/a0/73/56/a07356dbd5911c2fc768256c9349a411.jpg") center/cover no-repeat;
      filter: blur(0.5px);
      transform: scale(1.04);
    }

    #start-screen {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #061d40;
    }

    #start-button {
      border: 0;
      border-radius: 14px;
      padding: 18px 30px;
      background: #fff8da;
      color: #061d40;
      font-size: 1.35rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 0 25px #fff5;
    }

    #start-button:active {
      transform: scale(0.96);
    }

    #app {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    h1 {
      margin-top: 38px;
      color: #cf9eff;
      font-size: clamp(2.2rem, 6vw, 5.7rem);
      line-height: 1.05;
      text-align: center;
      text-shadow: 0 0 14px #c28cff, 0 0 30px #9564d9;
      z-index: 5;
    }

    h1 span, .modal-content h2 span {
      color: #d59cff;
    }

    .bouquet {
      position: absolute;
      bottom: -8px;
      left: 50%;
      width: min(900px, 94vw);
      height: 76vh;
      transform: translateX(-50%);
      display: flex;
      align-items: flex-end;
      justify-content: center;
      gap: clamp(8px, 2.6vw, 34px);
    }

    .flower {
      position: relative;
      width: clamp(75px, 12vw, 125px);
      height: clamp(235px, 35vh, 360px);
      cursor: pointer;
      z-index: 3;
      animation: sway 4s ease-in-out infinite;
      transition: filter 0.2s, transform 0.2s;
    }

    .flower:hover {
      filter: brightness(1.12);
      transform: translateY(-10px);
    }

    .flower-1 { margin-bottom: 4vh; transform: rotate(-15deg); }
    .flower-2 { margin-bottom: 9vh; transform: rotate(-7deg); animation-delay: .3s; }
    .flower-3 { margin-bottom: 12vh; animation-delay: .6s; }
    .flower-4 { margin-bottom: 8vh; transform: rotate(7deg); animation-delay: .9s; }
    .flower-5 { margin-bottom: 3vh; transform: rotate(15deg); animation-delay: 1.2s; }

    .flower-head {
      position: absolute;
      top: 0;
      left: 50%;
      width: clamp(72px, 10vw, 125px);
      height: clamp(72px, 10vw, 125px);
      transform: translateX(-50%);
      border-radius: 50%;
      background: linear-gradient(135deg, #2f5fe6, #2a3d9b 70%, #1a235a);
      box-shadow: 0 0 18px rgba(65, 125, 255, 0.7);
      overflow: visible;
      border: 0;
    }

    .flower-head i {
      position: absolute;
      left: 50%;
      bottom: 10%;
      width: 34%;
      height: 54%;
      border: 2px solid rgba(255,255,255,.15);
      border-radius: 55%;
      background: linear-gradient(180deg, #4b7cff, #2e55d6, #1a2e7b);
      transform-origin: 50% 88%;
      z-index: 1;
      box-shadow: inset 0 0 8px rgba(255,255,255,.15), 0 0 6px rgba(50,110,255,.5);
    }

    .flower-head i:nth-child(1) {
      transform: translateX(-50%) rotate(-45deg);
    }

    .flower-head i:nth-child(2) {
      transform: translateX(-50%) rotate(-15deg);
    }

    .flower-head i:nth-child(3) {
      transform: translateX(-50%) rotate(15deg);
    }

    .flower-head i:nth-child(4) {
      transform: translateX(-50%) rotate(45deg);
    }

    .flower-head b {
      display: none;
    }

    .flower-bike {
     position: absolute;
  z-index: 3;
  top: 10%;
  left: 10%;
  width: 80%;
  height: 80%;
  object-fit: cover;
  object-position: center;
  border-radius: 50%;
  border: 4px solid rgba(255, 255, 255, 0.85);
  box-shadow:
    0 0 8px white,
    0 0 18px #347aff,
    inset 0 0 10px rgba(0, 0, 0, 0.5);
    }

    .stem {
      position: absolute;
      top: clamp(72px, 10vw, 120px);
      left: 50%;
      width: 9px;
      height: calc(100% - 82px);
      transform: translateX(-50%);
      border-radius: 9px;
      background: linear-gradient(90deg, #245314, #6b9e25, #245314);
      box-shadow: inset 0 0 3px #111;
    }

    .leaf {
      position: absolute;
      top: 58%;
      width: clamp(22px, 4vw, 42px);
      height: clamp(65px, 10vw, 100px);
      border-radius: 100% 0;
      background: linear-gradient(135deg, #78bd2c, #245b18);
      box-shadow: inset 0 0 5px #183b12;
    }

    .leaf-left {
      left: 5%;
      transform: rotate(-35deg);
    }

    .leaf-right {
      right: 5%;
      transform: scaleX(-1) rotate(-35deg);
    }

    .grass {
      position: absolute;
      bottom: -5px;
      width: 16px;
      height: 210px;
      border-radius: 10px;
      background: linear-gradient(#5d9826, #173e13);
      z-index: 1;
    }

    .grass-left { left: 15%; transform: rotate(-30deg); }
    .grass-right { right: 15%; transform: rotate(30deg); }

    #particles {
      position: fixed;
      inset: 0;
      z-index: 4;
      pointer-events: none;
      overflow: hidden;
    }

    .particle {
      position: absolute;
      bottom: -10px;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #fff;
      opacity: 0.8;
      animation: float-up 3s linear forwards;
    }

    .modal {
      position: fixed;
      inset: 0;
      z-index: 50;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.78);
    }

    .modal.show {
      display: flex;
    }

    .close {
      position: absolute;
      top: 22px;
      right: 35px;
      border: 0;
      background: none;
      color: #fff;
      font-size: 3rem;
      line-height: 1;
      cursor: pointer;
      z-index: 2;
    }

    .modal-content {
      width: min(92vw, 700px);
      text-align: center;
    }

    .modal-content h2 {
      margin-bottom: 16px;
      color: #cf9eff;
      font-size: clamp(2rem, 5vw, 4.4rem);
      text-shadow: 0 0 13px #b678f5;
    }

    .modal-content img {
      display: block;
      width: min(80vw, 360px);
      height: min(62vh, 520px);
      margin: auto;
      object-fit: cover;
      border-radius: 18px;
      box-shadow: 0 0 30px #fff8;
      background: #fff;
    }

    .modal-content p {
      margin: 20px auto 0;
      max-width: 720px;
      font-size: clamp(1.1rem, 2.4vw, 1.8rem);
      line-height: 1.45;
    }

    .modal-content img[src=""] {
      display: none;
    }

    @keyframes sway {
      0%, 100% {
        transform: translateY(0px);
      }
      50% {
        transform: translateY(-8px);
      }
    }

    @keyframes float-up {
      to {
        transform: translate(var(--x), -80vh) scale(0.3);
        opacity: 0;
      }
    }

    @media (max-width: 600px) {
      h1 {
        margin-top: 24px;
      }

      .bouquet {
        gap: 0;
        height: 66vh;
      }

      .flower {
        width: 20vw;
        height: 270px;
      }

      .flower-head {
        width: 20vw;
        height: 20vw;
      }

      .grass {
        height: 150px;
      }

      .close {
        right: 18px;
        top: 12px;
      }

      .modal-content img {
        height: 55vh;
      }
    }
  </style>
</head>
<body>
  <div id="start-screen">
    <button id="start-button">Apretá aquí 💙</button>
  </div>

  <main id="app" class="hidden">
    <div class="background"></div>
    <h1>Feliz 30 de septiembre<span>❤</span>!</h1>

    <section class="bouquet" aria-label="Ramo de motos">
      <article class="flower flower-1" data-index="0">
        <div class="flower-head">
          <img class="flower-bike" alt="Moto">
          <i></i><i></i><i></i><i></i><b></b>
        </div>
        <div class="stem"></div>
        <div class="leaf leaf-left"></div>
        <div class="leaf leaf-right"></div>
      </article>

      <article class="flower flower-2" data-index="1">
        <div class="flower-head">
          <img class="flower-bike" alt="Moto">
          <i></i><i></i><i></i><i></i><b></b>
        </div>
        <div class="stem"></div>
        <div class="leaf leaf-left"></div>
        <div class="leaf leaf-right"></div>
      </article>

      <article class="flower flower-3" data-index="2">
        <div class="flower-head">
          <img class="flower-bike" alt="Moto">
          <i></i><i></i><i></i><i></i><b></b>
        </div>
        <div class="stem"></div>
        <div class="leaf leaf-left"></div>
        <div class="leaf leaf-right"></div>
      </article>

      <article class="flower flower-4" data-index="3">
        <div class="flower-head">
          <img class="flower-bike" alt="Moto">
          <i></i><i></i><i></i><i></i><b></b>
        </div>
        <div class="stem"></div>
        <div class="leaf leaf-left"></div>
        <div class="leaf leaf-right"></div>
      </article>

      <article class="flower flower-5" data-index="4">
        <div class="flower-head">
          <img class="flower-bike" alt="Moto">
          <i></i><i></i><i></i><i></i><b></b>
        </div>
        <div class="stem"></div>
        <div class="leaf leaf-left"></div>
        <div class="leaf leaf-right"></div>
      </article>

      <div class="grass grass-left"></div>
      <div class="grass grass-right"></div>
    </section>

    <div id="particles"></div>
  </main>

  <section id="modal" class="modal" aria-hidden="true">
    <button id="close-modal" class="close" aria-label="Cerrar">×</button>
    <div class="modal-content">
      <h2>Feliz 30 de septiembre<span>❤</span>!</h2>
      <img id="modal-image" src="" alt="Moto">
      <p id="modal-message"></p>
    </div>
  </section>

  <audio id="music" loop preload="auto">
    <source src="https://github.com/Baque2005/public-files/raw/refs/heads/main/2025/new%20west%20-%20those%20eyes%20%20sub.%20espa%C3%B1ol.mp3" type="audio/mpeg">
  </audio>

  <script>
    const messages = [
      "Aunque no recibi nada quiero hacerte sentir especial con este detalle que no es mucho pero lleva un gran cariño.",
      "Gracias por ser una persona especial para mi.",
      "Gracias por dedicarme un poco de tu tiempo.",
      "Feliz dia 30 de septiembre.",
      "Te quiero mucho, más de lo que las palabras pueden decir."
    ];

    const motoImages = [
      "img/moto-1.jpg", // Suzuki negra con rojo
  "img/moto-2.jpg", // Yamaha roja
  "img/moto-3.jpg", // Moto negra
  "img/moto-4.jpg", // Honda roja de motocross
  "img/moto-5.jpg"  // Kawasaki verde
    ];

    const startScreen = document.getElementById("start-screen");
    const startButton = document.getElementById("start-button");
    const app = document.getElementById("app");
    const music = document.getElementById("music");
    const modal = document.getElementById("modal");
    const modalImage = document.getElementById("modal-image");
    const modalMessage = document.getElementById("modal-message");
    const closeModal = document.getElementById("close-modal");

    startButton.addEventListener("click", () => {
      startScreen.style.display = "none";
      app.classList.remove("hidden");
      music.volume = 0.35;
      music.play().catch(() => {});
      createParticles();
    });

    document.querySelectorAll(".flower").forEach((flower, index) => {
      const image = flower.querySelector(".flower-bike");
      if (image) image.src = motoImages[index];
    });

    document.querySelectorAll(".flower").forEach((flower) => {
      flower.addEventListener("click", () => {
        const index = Number(flower.dataset.index);
        modalImage.src = motoImages[index];
        modalMessage.textContent = messages[index];
        modal.classList.add("show");
        modal.setAttribute("aria-hidden", "false");
      });
    });

    function closeTheModal() {
      modal.classList.remove("show");
      modal.setAttribute("aria-hidden", "true");
      modalImage.src = "";
    }

    closeModal.addEventListener("click", closeTheModal);
    modal.addEventListener("click", (event) => {
      if (event.target === modal) closeTheModal();
    });
    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape") closeTheModal();
    });

    function createParticles() {
      const container = document.getElementById("particles");
      setInterval(() => {
        const particle = document.createElement("span");
        particle.className = "particle";
        particle.style.left = `${Math.random() * 100}vw`;
        particle.style.setProperty("--x", `${(Math.random() - 0.5) * 24}vw`);
        particle.style.animationDuration = `${2.2 + Math.random() * 2}s`;
        container.appendChild(particle);
        setTimeout(() => particle.remove(), 4500);
      }, 380);
    }
  </script>
</body>
</html>
